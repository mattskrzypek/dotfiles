name: Check installer
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - run: shellcheck install.sh update.sh restore.sh
      - run: for script in install.sh update.sh restore.sh; do bash -n "$script"; done
      - run: luac -p config/dotfiles.lua
      - run: python3 -m unittest discover -s tests -v
      - run: bash install.sh --dry-run
