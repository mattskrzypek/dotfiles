"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
scan_timeout = 30
command_timeout = 500
palette = 'cyberpunk'
format = '$username$hostname$directory$git_branch$git_commit$git_state$git_status$nodejs$python$rust$golang$cmd_duration$jobs$status$character'

[palettes.cyberpunk]
green = '#39ff88'
bright_green = '#70ffa7'
cyan = '#61dbc0'
purple = '#cabbea'
yellow = '#f5f5a1'
red = '#ff8b9b'
white = '#e6e6e6'

[directory]
style = 'bold white'
truncation_length = 4
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' read-only'
read_only_style = 'bold red'
format = '[$path]($style)[$read_only]($read_only_style) '

[character]
success_symbol = '[❯❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮❮](bold green)'

[username]
style_user = 'bold green'
style_root = 'bold red'
format = '[\[](bold green)[$user]($style)'
show_always = true

[hostname]
ssh_only = false
format = '[@](green)[$hostname](bold white)[\]](bold green) '

[git_branch]
symbol = ''
style = 'bold bright_green'
format = '[git:$branch]($style) '
truncation_length = 32

[git_commit]
only_detached = true
format = '[@$hash]($style) '
style = 'bold bright_green'

[git_state]
style = 'bold yellow'
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = 'bright_green'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = 'conflict:${count} '
untracked = '?${count} '
modified = '!${count} '
staged = '+${count} '
renamed = 'rename:${count} '
deleted = '-${count} '
stashed = 'stash:${count} '
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'

[cmd_duration]
min_time = 2000
style = 'bright_green'
format = '[took $duration]($style) '

[jobs]
symbol = 'jobs:'
style = 'bold white'
number_threshold = 1
symbol_threshold = 1
format = '[$symbol$number]($style) '

[status]
disabled = false
symbol = 'exit:'
style = 'bold red'
format = '[$symbol$status]($style) '

[nodejs]
symbol = 'node '
style = 'green'
format = '[$symbol$version]($style) '

[python]
symbol = 'py '
style = 'bright_green'
format = '[${symbol}${version}( $virtualenv)]($style) '

[rust]
symbol = 'rust '
style = 'green'
format = '[$symbol$version]($style) '

[golang]
symbol = 'go '
style = 'green'
format = '[$symbol$version]($style) '
